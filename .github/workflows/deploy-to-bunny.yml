name: Bunny.Net Deployment CI/CD

on:
  push:
    branches:
      - develop
  repository_dispatch:
    types: [function_trigger]
  workflow_dispatch:

# Runs on develop queue rather than overlap, so two runs never publish or
# commit generated state at the same time.
concurrency:
  group: deploy-develop
  cancel-in-progress: false

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:cicd
          use-cache: true
      - name: Load cache
        uses: actions/cache@v4
        with:
          path: |
            .cache
          key: ${{ runner.os }}-build-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate OG images
        run: npm run og
      - name: Build
        run: npm run build
        env:
          MAGE_API_TOKEN: ${{ secrets.MAGE_API_TOKEN }}
      - name: Check build before publishing
        run: npm run check -- --allow picture-img-dimensions
      - name: Publish to ATProto
        env:
          PDS_URL: ${{ secrets.PDS_URL }}
          ATP_IDENTIFIER: ${{ secrets.ATP_IDENTIFIER }}
          ATP_APP_PASSWORD: ${{ secrets.ATP_APP_PASSWORD }}
        run: npx sequoia publish
      # Rebuild so pages include the atUri values Sequoia just wrote.
      - name: Build with published state
        run: npm run build
        env:
          MAGE_API_TOKEN: ${{ secrets.MAGE_API_TOKEN }}
      - name: Check final build
        run: npm run check -- --allow picture-img-dimensions
      # Recovery: if a run fails after "Publish to ATProto", re-run the
      # workflow. Posts already published are only recorded in
      # .sequoia-state.json if this step ran; if it did not, Sequoia will see
      # them as new again, so check the AT Protocol records before re-running
      # and, if necessary, commit the state file by hand.
      - name: Commit Sequoia state
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add .sequoia-state.json src/posts/ src/assets/images/social-preview/ || true
          if ! git diff --cached --quiet; then
            git commit -m "Update Sequoia state [skip ci]"
            git push
          fi
      - name: Save cache
        uses: actions/cache@v4
        with:
          path: |
            .cache
          key: ${{ runner.os }}-build-${{ hashFiles('**/package-lock.json') }}
      - name: Deploy to BunnyCDN
        uses: ayeressian/bunnycdn-storage-deploy@v2.3.0
        with:
          source: "dist"
          destination: ""
          storageZoneName: "${{ secrets.STORAGE_NAME }}"
          storagePassword: "${{ secrets.STORAGE_PASSWORD }}"
          storageEndpoint: "uk.storage.bunnycdn.com"
          accessKey: "${{ secrets.ACCESS_KEY }}"
          pullZoneId: "${{ secrets.ZONE_ID }}"
          upload: "true"
          remove: "true"
          purgePullZone: "true"
          purgePullZoneDelay: "45"
      # - name: send webhook
      #   run: |
      #     curl -X POST -H "Content-Type: application/json" -d '{"message": "Deployment to BunnyCDN completed successfully."}' "${{ secrets.WEBHOOK_URL }}"
      #   env:
      #     WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}

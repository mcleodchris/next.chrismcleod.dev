name: Check

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    name: Build and check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      # No secrets here. Until the Paintslam data is read from a committed
      # snapshot, the build's fetch from mage gets nothing and the Paintslam
      # pages are missing; no check depends on them, so that is expected.
      - name: Build
        run: npm run build
      - name: Check build
        run: npm run check -- --allow picture-img-dimensions

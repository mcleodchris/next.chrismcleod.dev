name: Check

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    name: Build and check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      # No secrets here: the build reads the committed snapshots in data/.
      - name: Build
        run: npm run build
      - name: Check build
        run: npm run check
